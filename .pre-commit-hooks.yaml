- id: add-license
  name: Add License
  entry: tools/add_copyright.py
  language: script
  stages: [pre-commit]
  verbose: true
  require_serial: true
  # GitHub issue/PR templates must start with YAML frontmatter; keep
  # license headers out of them.
  exclude: ^\.github/
- id: add-spdx-license
  name: Add SPDX License Header
  entry: tools/add_spdx_header.py
  language: script
  files: \.(py|pyi|sh|bash|yaml|yml|cc|cpp|cxx|h|hpp|cu|cuh)$
  stages: [pre-commit]
  verbose: true
  require_serial: true
